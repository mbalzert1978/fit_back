[project]
name = "fit-back"
version = "0.1.0"
description = "Fitness and nutrition tracking backend"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.114.0",
    "uvicorn[standard]>=0.32.0",
    "asyncpg>=0.30.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
]
