[project]
name = "fit-back"
version = "0.1.0"
description = "Fitness and nutrition tracking backend"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.114.0",
    "uvicorn[standard]>=0.52.1",
    "asyncpg>=0.31.0",
    "pydantic>=2.13.4",
    "alembic>=1.19.0",
    "sqlalchemy>=2.0.51",
    # IANA-Zeitzonendatenbank fuer zoneinfo. Windows liefert keine mit, ohne
    # tzdata ist available_timezones() dort leer und jede gueltige Zeitzone
    # (Europe/Berlin) wuerde als unbekannt abgelehnt.
    "tzdata>=2026.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.16.1",
    "import-linter>=2.13",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.1",
    "testcontainers[postgres]>=4.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = [".claude", ".rules"]

[tool.ruff.lint]
extend-select = ["ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN001", "ANN002", "ANN003"]
"**/test_*.py" = ["ANN001", "ANN002", "ANN003"]