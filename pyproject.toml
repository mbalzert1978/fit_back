[project]
name = "fit-back"
version = "0.1.0"
description = "Fitness and nutrition tracking backend"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.114.0",
    "uvicorn[standard]>=0.32.0",
    "asyncpg>=0.30.0",
    "pydantic>=2.0.0",
    "alembic>=1.19.0",
    "sqlalchemy>=2.0.51",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "import-linter>=2.1.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "testcontainers[postgres]>=4.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = [".claude", ".rules"]

[tool.ruff.lint]
extend-select = ["ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN001", "ANN002", "ANN003"]
"**/test_*.py" = ["ANN001", "ANN002", "ANN003"]