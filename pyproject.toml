[project]
name = "fit-back"
version = "0.1.0"
description = "Fitness and nutrition tracking backend"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.114.0",
    "uvicorn[standard]>=0.52.1",
    "asyncpg>=0.31.0",
    "pydantic>=2.13.4",
    "alembic>=1.19.0",
    "sqlalchemy[asyncio]>=2.0.51",
    # Explizit und nicht bloss ueber `sqlalchemy[asyncio]`: SQLAlchemy schraenkt
    # `greenlet` per Umgebungs-Marker ein und liefert es auf Python 3.14 nicht
    # mit. Ohne die Bibliothek bricht die Async-Engine bei jedem
    # Verbindungsaufbau ab ("the greenlet library is required to use this
    # function") - und der Abbruch erscheint als Alembic-Fehler in der
    # Test-Fixture, also weit weg von seiner Ursache.
    "greenlet>=3.5.4",
    # IANA-Zeitzonendatenbank fuer zoneinfo. Windows liefert keine mit, ohne
    # tzdata ist available_timezones() dort leer und jede gueltige Zeitzone
    # (Europe/Berlin) wuerde als unbekannt abgelehnt.
    "tzdata>=2026.3",
    # IDNA 2008 / UTS-46 fuer internationalisierte Domainnamen in E-Mail-Adressen.
    # Die stdlib kann nur IDNA 2003 (encodings.idna) und liegt bei mehreren
    # Labels und bei der Normalisierung anders.
    "idna>=3.18",
    "argon2-cffi>=25.1.0",
    # JWT-Signatur und -Pruefung fuer die Access-Token (BACKEND.md Abschnitt 8).
    # Die Bibliothek war laut docs/milestones/01-technical-decisions.md bis M1
    # offen; sie steht hinter der Naht `RegisterUserSessionTokens`, so wie
    # argon2-cffi hinter `RegisterUserPasswordHasher` - selbst gebaute
    # Signatur- und Ablauf-Pruefung ist am Sicherheitspfad nichts, was man sich
    # spart.
    "pyjwt>=2.10.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.16.1",
    "import-linter>=2.13",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.1",
    "testcontainers[postgres]>=4.15.0",
    "pact-python>=3.4.0",
    "ty>=0.0.74",
]

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = [".claude", ".rules"]

[tool.ruff.lint]
select = ["ALL"]

ignore = [
    "CPY001",  # Copyright-Kopf je Datei - dieses Repo hat die Konvention nicht
    "COM812",  # Trailing-Comma-Regel kollidiert mit dem ruff-Formatter (dessen eigene Warnung)
    "ISC001",  # implizite String-Verkettung - dieselbe Kollision mit dem Formatter
    "D203",    # unvereinbar mit D211; ruff waehlt ohnehin D211
    "D213",    # unvereinbar mit D212; ruff waehlt ohnehin D212
    "D401",    # "imperative mood" ist eine Heuristik auf englischen Verben; die
               # Docstrings dieses Repos sind deutsch (CLAUDE.md), die Regel misst dort nichts
    "TC001",   # Imports unter `if TYPE_CHECKING` verstecken. Dieser Stack laeuft bewusst ohne
    "TC002",   # mypy/pyright (.rules/python/README.md) - die Trennung braechte keinen Nutzen,
    "TC003",   # und zur Laufzeit aufloesbare Annotationen sind uns lieber als gesparte Imports
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"uuid.uuid4".msg = "Sortierbare IDs: uuid7() statt uuid4() — siehe .rules/python/python-modern-syntax.md."

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ALL"]
"src/contexts/*/specs/**" = ["ALL"]
"alembic/*/versions/**" = ["INP001"]  # Alembic verwaltet diese Revisionen über seinen eigenen Loader
"alembic/env.py" = ["INP001"]  # Alembic führt env.py direkt auf, kein importierbares Paket
"scripts/**" = [
    "INP001",  # direkt aufgerufene Skripte, kein importierbares Paket
    "T201",    # `print` ist bei einem CLI-Werkzeug die Ausgabe, nicht ein Debug-Rest
    "S101",    # `assert` im mitgelieferten --demo-Selbsttest
]

[tool.pytest.ini_options]
# Eine DeprecationWarning ist eine Ankuendigung mit Frist - sie soll die Suite
# brechen, solange die Frist laeuft, nicht still mitlaufen. Ausnahmen werden
# einzeln benannt, mit Paket, Grund und Upstream-Link.
filterwarnings = [
    "error::DeprecationWarning",
    # uvloop 0.22.1: `Loop.run_in_executor` und `add_signal_handler` rufen das
    # deprecatete `asyncio.iscoroutinefunction` (uvloop/includes/stdlib.pxi:40).
    # Sichtbar wird es dort, wo hineingelaufen wird - `asyncio.to_thread` in
    # tests/contracts/provider_verification.py; ausgeloest wird es von uvloop.
    # Upstream behoben, aber noch nicht veroeffentlicht: PR ist am 2026-01-15
    # nach master gemergt, das juengste Release 0.22.1 stammt vom 2025-10-16.
    # Der Eintrag faellt weg, sobald ein Release nach diesem Merge da ist.
    # https://github.com/MagicStack/uvloop/issues/703
    # https://github.com/MagicStack/uvloop/pull/705
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
]

# ---------------------------------------------------------------------------
# ty (Astral) - der Typechecker. `ruff` prueft keine Typen; ohne dieses
# Werkzeug ist jede Annotation im Repo Dokumentation statt Zusage (Issue #97).
#
# ty ist Preview. Faellt es aus, sind `mypy` oder `pyright` die Rueckfallebene -
# beide lesen dieselben Annotationen, nur die Konfiguration unten waere neu zu
# schreiben.
#
# Hier stand eine **Baseline**: 37 eingefrorene Befunde in 18 Dateien, damit
# das Gate ab sofort scharf laufen konnte, obwohl der Bestand es noch nicht
# hergab. Sie ist in fuenf Wellen abgebaut und seit dem 2026-08-26 **leer** -
# `ty` prueft `src/` vollstaendig, ohne eine einzige Ausnahme.
#
# Kommt hier je wieder ein [[tool.ty.overrides]]-Block hin, ist das ein
# Rueckschritt und gehoert begruendet: was gemessen wurde, warum es sich nicht
# beheben liess, und wann die Zeile wieder faellt.
# Hergang und Zaehlung: docs/decisions/2026-08-25-1500-typechecker-ty.md
# ---------------------------------------------------------------------------
[tool.ty.rules]
# Ein nicht aufloesbarer Import ist ein echter Fehler, kein Hinweis.
unresolved-import = "error"
