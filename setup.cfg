[importlinter]
root_package = src
# Noetig, damit der domain-purity-Contract externe Pakete (fastapi, sqlalchemy, ...)
# ueberhaupt als verbotene Ziele sehen kann.
include_external_packages = True

# Die Domaene haengt nur an der stdlib (.rules/python/python-feature-slices.md,
# "Drei Schichten je Feature-Paket"). Das war bislang nur Prosa und wurde in M0
# wiederholt verletzt - siehe docs/decisions/2026-08-06-0751-slice-form-test-api-
# baureihenfolge.md. src.shared_kernel fehlt hier bewusst noch: er importiert
# aktuell starlette/fastapi/pydantic/asyncpg aus den gemergten Tickets 0005-0007
# und wird erst nach dem zweiten Slice neu geschnitten; danach hier ergaenzen.
[importlinter:contract:domain-purity]
name = Domaenen-Schichten haengen nur an der stdlib
type = forbidden
source_modules =
    src.contexts.identity.domain
    src.contexts.identity.contracts
    src.contexts.catalog.domain
    src.contexts.diary.domain
    src.contexts.recipes.domain
    src.contexts.goals.domain
    src.contexts.health_sync.domain
forbidden_modules =
    fastapi
    starlette
    pydantic
    sqlalchemy
    asyncpg
    alembic
    src.shared_infrastructure

# Schichtung innerhalb jedes Context: infrastructure -> application -> domain
# -> contracts, strikt einseitig nach innen. Die Domaene kennt weder Application
# noch Infrastruktur; die Application kennt die Infrastruktur nicht.
#
# `contracts` liegt zuinnerst: es ist das veroeffentlichte Vokabular, das andere
# Contexts importieren duerfen. Wuerde es die eigene Domaene kennen, zoege jeder
# Konsument diese ueber den Vertrag mit herein - und die Grenze waere nur noch
# auf dem Papier vorhanden.
[importlinter:contract:context-layers]
name = Schichtung im Slice (infrastructure -> application -> domain -> contracts)
type = layers
layers =
    infrastructure
    application
    domain
# In Klammern = optionale Schicht: die uebrigen Contexts haben noch kein
# `contracts`-Paket, und leere Pakete nur zum Beruhigen des Linters anzulegen
# waere Rauschen. Sobald eines entsteht, greift die Regel dort automatisch.
    (contracts)
containers =
    src.contexts.identity
    src.contexts.catalog
    src.contexts.diary
    src.contexts.recipes
    src.contexts.goals
    src.contexts.health_sync

[importlinter:contract:forbidden]
name = Bounded Context Import Boundaries
type = forbidden
source_modules =
    src.contexts.identity
    src.contexts.catalog
    src.contexts.diary
    src.contexts.recipes
    src.contexts.goals
    src.contexts.health_sync
forbidden_modules =
    src.contexts.identity.domain
    src.contexts.identity.infrastructure
    src.contexts.catalog.domain
    src.contexts.catalog.infrastructure
    src.contexts.diary.domain
    src.contexts.diary.infrastructure
    src.contexts.recipes.domain
    src.contexts.recipes.infrastructure
    src.contexts.goals.domain
    src.contexts.goals.infrastructure
    src.contexts.health_sync.domain
    src.contexts.health_sync.infrastructure
